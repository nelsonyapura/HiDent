server.port=8080
server.address=0.0.0.0
spring.application.name=Hi Dent

spring.datasource.url=jdbc:postgresql://localhost:5432/odontologia_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

spring.web.resources.static-locations=classpath:/static/

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

logging.level.org.springframework.security=WARN
logging.level.com.odontologia=INFO

jwt.secret=${JWT_SECRET:changeThisSecretInProduction}
jwt.expiration-hours=10

app.upload.dir=${UPLOAD_DIR:uploads/documents}

backup.dir=${BACKUP_DIR:backups}
backup.db.name=odontologia_db
backup.db.user=postgres
backup.db.password=${DB_PASSWORD:postgres}
backup.pg-dump=${PG_DUMP:pg_dump}
backup.drive.folder-id=${DRIVE_FOLDER_ID:your-folder-id}
backup.drive.credentials=${DRIVE_CREDENTIALS:credentials.json}
backup.drive.max-files=15

spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${SMTP_USERNAME:your-email@gmail.com}
spring.mail.password=${SMTP_PASSWORD:your-app-password}
spring.mail.protocol=smtps
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
backup.notify.email=${NOTIFY_EMAIL:your-email@gmail.com}
