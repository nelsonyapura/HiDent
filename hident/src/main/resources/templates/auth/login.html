<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Hi Dent - Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link th:href="@{/css/login.css}" rel="stylesheet">
</head>

<body class="d-flex align-items-center min-vh-100">

<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-10 col-xl-9">

      <div class="card login-card shadow-lg border-0">
        <div class="row g-0 h-100">


          <div class="col-md-6 soft-left d-flex align-items-center justify-content-center position-relative p-5">


            <svg class="tooth-bg" style="top:-20px;left:-10px;" width="200" height="200" viewBox="0 0 200 200">
              <path d="M95 20c18 0 30 12 30 30 0 10-3 19-6 27-2 6-4 11-4 16 0 10 4 19 4 31 0 23-10 55-24 55S71 150 71 127c0-12 4-21 4-31 0-5-2-10-4-16-3-8-6-17-6-27 0-18 12-30 30-30Z"/>
            </svg>
            <svg class="tooth-bg" style="bottom:10px;right:10px;" width="160" height="160" viewBox="0 0 200 200">
              <path d="M95 20c18 0 30 12 30 30 0 10-3 19-6 27-2 6-4 11-4 16 0 10 4 19 4 31 0 23-10 55-24 55S71 150 71 127c0-12 4-21 4-31 0-5-2-10-4-16-3-8-6-17-6-27 0-18 12-30 30-30Z"/>
            </svg>
            <svg class="tooth-bg" style="top:40%;left:5%;" width="100" height="100" viewBox="0 0 200 200">
              <path d="M95 20c18 0 30 12 30 30 0 10-3 19-6 27-2 6-4 11-4 16 0 10 4 19 4 31 0 23-10 55-24 55S71 150 71 127c0-12 4-21 4-31 0-5-2-10-4-16-3-8-6-17-6-27 0-18 12-30 30-30Z"/>
            </svg>
            <svg class="tooth-bg" style="bottom:30%;right:5%;" width="120" height="120" viewBox="0 0 200 200">
              <path d="M95 20c18 0 30 12 30 30 0 10-3 19-6 27-2 6-4 11-4 16 0 10 4 19 4 31 0 23-10 55-24 55S71 150 71 127c0-12 4-21 4-31 0-5-2-10-4-16-3-8-6-17-6-27 0-18 12-30 30-30Z"/>
            </svg>


            <svg class="position-absolute opacity-25" style="bottom:40px;left:0;right:0;" width="100%" height="60" viewBox="0 0 300 60" preserveAspectRatio="none">
              <path d="M0 30c25 0 25-15 50-15s25 15 50 15 25-15 50-15 25 15 50 15 25-15 50-15 25 15 50 15"
                    fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
              <path d="M0 50c25 0 25-12 50-12s25 12 50 12 25-12 50-12 25 12 50 12 25-12 50-12 25 12 50 12"
                    fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
            </svg>


            <div class="text-center position-relative">

                <img th:src="@{/img/logo.png}" alt="Hi Dent" class="img-fluid" style="max-width:400px;">

            </div>
          </div>


          <div class="col-md-6 bg-white d-flex align-items-center p-5">
            <div class="w-100" style="max-width: 340px; margin: 0 auto;">

              <h5 class="fw-bold text-center mb-4" style="color:#333;">Bienvenido</h5>


              <div th:if="${error}" class="alert alert-danger py-2 small mb-3 d-flex align-items-center gap-2">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span th:text="${error}">Error</span>
              </div>
              <div th:if="${param.logout}" class="alert alert-success py-2 small mb-3 d-flex align-items-center gap-2">
                <i class="bi bi-check-circle-fill"></i>
                Sesión cerrada correctamente
              </div>


              <form th:action="@{/auth/login}" th:object="${loginRequest}" method="post">


                <div class="input-group input-group-lg mb-4">
                  <span class="input-group-text bg-white border-end-0 rounded-start-pill">
                    <i class="bi bi-person-fill text-secondary"></i>
                  </span>
                  <input type="text"
                         class="form-control border-start-0 rounded-end-pill"
                         th:field="*{username}"
                         placeholder="Usuario"
                         required autofocus>
                </div>


                <div class="input-group input-group-lg mb-4">
                  <span class="input-group-text bg-white border-end-0 rounded-start-pill">
                    <i class="bi bi-lock-fill text-secondary"></i>
                  </span>
                  <input id="password"
                         type="password"
                         class="form-control border-start-0 border-end-0"
                         th:field="*{password}"
                         placeholder="Contraseña"
                         required>
                  <button class="btn btn-outline-secondary rounded-end-pill" type="button" onclick="togglePass()">
                    <i id="eye-open" class="bi bi-eye"></i>
                    <i id="eye-closed" class="bi bi-eye-slash d-none"></i>
                  </button>
                </div>


                <button type="submit"
                        class="btn btn-hident btn-lg text-white w-100 rounded-pill shadow-sm fw-semibold">
                  Iniciar Sesión
                </button>
              </form>

            </div>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>

<script th:src="@{/js/login.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
