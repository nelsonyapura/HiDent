<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{fragments/base}" lang="es">

<head>
    <title>Pacientes</title>
</head>

<body>

    <div layout:fragment="topbar-title">
        <i class="bi bi-people me-1"></i> Lista de Pacientes
        <span class="hd-hint ms-2" th:text="${totalCount + ' paciente(s)'}">0</span>
    </div>

    <div layout:fragment="content">
        <div class="hd-page">

            <small th:if="${!#strings.isEmpty(query)}" class="text-muted d-block mb-2">
                Resultados para: <strong th:text="'«' + ${query} + '»'"></strong>
            </small>

            <form th:action="@{/patients}" method="get" class="hd-card hd-search-bar mb-3">
                <div class="card-body p-3 d-flex gap-2 align-items-center">
                    <input class="form-control" type="text" name="q" th:value="${query}"
                        placeholder="Buscar por DNI, nombre o apellido..." autocomplete="off">
                    <button type="submit" class="btn btn-teal px-4">Buscar</button>
                    <a th:href="@{/patients}" class="btn btn-outline-secondary"
                        th:classappend="${#strings.isEmpty(query)} ? 'invisible'">
                        <i class="bi bi-x-lg"></i>
                    </a>
                </div>
            </form>

            <div class="hd-card overflow-hidden">
                <table th:if="${!patients.isEmpty()}" class="table table-hover align-middle mb-0">
                    <thead>
                        <tr style="background:#0F766E;">
                            <th style="color:#000000;font-size:12px;font-weight:600;">Paciente</th>
                            <th style="color:#000000;font-size:12px;font-weight:600;">DNI</th>
                            <th style="color:#000000;font-size:12px;font-weight:600;" class="d-none d-md-table-cell">
                                Teléfono</th>
                            <th style="color:#000000;font-size:12px;font-weight:600;" class="d-none d-md-table-cell">
                                Edad</th>
                            <th style="color:#000000;font-size:12px;font-weight:600;" class="d-none d-lg-table-cell">
                                Última Visita</th>
                            <th style="color:#000000;font-size:12px;font-weight:600;" class="d-none d-lg-table-cell">
                                Próxima Cita</th>
                            <th style="color:#000000;font-size:12px;font-weight:600;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${patients}">
                            <td>
                                <div class="d-flex align-items-center gap-2">
                                    <div class="hd-avatar sm bg-dark rounded-circle"></div>
                                    <div>
                                        <div class="fw-semibold small">
                                            <span th:text="${p.fullName}">Nombre</span>
                                            <span th:if="${p.minor}" class="badge bg-danger-subtle text-danger ms-1"
                                                style="font-size:9px;">Menor</span>
                                        </div>
                                        <small th:if="${p.createdBy}" class="text-muted"
                                            th:text="'Alta: ' + ${p.createdBy}"></small>
                                    </div>
                                </div>
                            </td>
                            <td><code class="fw-bold" th:text="${p.dni}">00000000</code></td>
                            <td class="d-none d-md-table-cell text-muted small" th:text="${p.phone} ?: '—'">—</td>
                            <td class="d-none d-md-table-cell text-muted small"
                                th:text="${p.effectiveAge != null ? p.effectiveAge + ' años' : '—'}">—</td>
                            <td class="d-none d-lg-table-cell small">
                                <span th:if="${lastVisitMap.containsKey(p.idPatient)}"
                                    class="badge bg-success-subtle text-success rounded-pill"
                                    th:text="${lastVisitMap.get(p.idPatient)}">—</span>
                                <span th:unless="${lastVisitMap.containsKey(p.idPatient)}" class="text-muted">Sin
                                    visitas</span>
                            </td>
                            <td class="d-none d-lg-table-cell small">
                                <span th:if="${nextApptMap.containsKey(p.idPatient)}"
                                    class="badge bg-primary-subtle text-primary rounded-pill"
                                    th:text="${nextApptMap.get(p.idPatient)}">—</span>
                                <span th:unless="${nextApptMap.containsKey(p.idPatient)}" class="text-muted">Sin
                                    citas</span>
                            </td>
                            <td>
                                <div class="d-flex gap-1">
                                    <a th:href="@{'/patient/' + ${p.idPatient}}"
                                        class="btn btn-sm btn-outline-teal py-0 px-2">
                                        <i class="bi bi-clipboard-pulse"></i> Ficha
                                    </a>
                                    <button type="button" class="btn btn-sm btn-outline-danger py-0 px-2 btn-del"
                                        th:data-id="${p.idPatient}" th:data-name="${p.fullName}" th:data-dni="${p.dni}">
                                        <i class="bi bi-trash3"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div th:if="${patients.isEmpty()}" class="hd-empty">
                    <i class="bi bi-people"></i>
                    <h6
                        th:text="${!#strings.isEmpty(query)} ? 'Sin resultados para «' + ${query} + '»' : 'Aún no hay pacientes'">
                    </h6>
                    <small
                        th:text="${!#strings.isEmpty(query)} ? 'Prueba con otro término' : 'Se mostrarán aquí al registrarlos'"></small>
                </div>
            </div>
        </div>


        <div class="modal fade" id="deleteModal" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered modal-sm">
                <div class="modal-content border-0 rounded-4 shadow">
                    <div class="modal-body text-center p-4">
                        <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                            style="width:60px;height:60px;background:#FEE2E2;">
                            <i class="bi bi-trash3 text-danger" style="font-size:1.5rem;"></i>
                        </div>
                        <h6 class="fw-bold">¿Eliminar paciente?</h6>
                        <p class="small text-muted">El paciente quedará desactivado.</p>
                        <div class="fw-bold rounded-3 p-2 mb-3" style="background:#F1F5F9;" id="modalName">—</div>
                        <div class="d-flex gap-2">
                            <button class="btn btn-secondary flex-fill" data-bs-dismiss="modal">Cancelar</button>
                            <form id="deleteForm" method="post" class="flex-fill">
                                <input type="hidden" name="q" th:value="${query}">
                                <button type="submit" class="btn btn-danger w-100"><i class="bi bi-trash3"></i>
                                    Eliminar</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <th:block layout:fragment="scripts">
        <script>
            var deleteModal = null;
            document.addEventListener('click', function (e) {
                var btn = e.target.closest('.btn-del');
                if (!btn) return;
                document.getElementById('modalName').textContent = btn.dataset.name + '  ·  DNI ' + btn.dataset.dni;
                document.getElementById('deleteForm').action = '/patients/' + btn.dataset.id + '/delete';
                if (!deleteModal) deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));
                deleteModal.show();
            });
        </script>
    </th:block>

</body>

</html>
